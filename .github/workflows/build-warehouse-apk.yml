name: WAREHOUSE APK — SM Produce

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'warehouseapp/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-warehouse-apk.yml'

jobs:
  build-warehouse:
    name: Build WAREHOUSE only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build WAREHOUSE APK
        run: gradle :warehouseapp:assembleDebug
      - name: Rename WAREHOUSE APK clearly
        run: |
          mkdir -p dist
          cp warehouseapp/build/outputs/apk/debug/warehouseapp-debug.apk dist/SMProduce-WAREHOUSE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WAREHOUSE-APK-ONLY
          path: dist/SMProduce-WAREHOUSE.apk
          if-no-files-found: error
