name: Build Veggie TC26 APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'veggie-tc26-app/**'
      - '.github/workflows/build-veggie-tc26-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Veggie truck launcher icon only
        shell: bash
        run: |
          rm -f veggie-tc26-app/app/src/main/res/drawable/ic_veggie.xml
          printf '%s' '' | base64 --decode > veggie-tc26-app/app/src/main/res/drawable/ic_veggie.webp
          file veggie-tc26-app/app/src/main/res/drawable/ic_veggie.webp

      - name: Build APK
        run: gradle -p veggie-tc26-app :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp veggie-tc26-app/app/build/outputs/apk/debug/app-debug.apk dist/SMProduce-Veggie-TC26.apk

      - name: Commit built APK back to repo
        run: |
          mkdir -p built
          cp dist/SMProduce-Veggie-TC26.apk built/SMProduce-Veggie-TC26.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add built/SMProduce-Veggie-TC26.apk
          git commit -m "Update built Veggie TC26 APK [skip ci]" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: SMProduce-Veggie-TC26-APK
          path: dist/SMProduce-Veggie-TC26.apk
          if-no-files-found: error
          retention-days: 30
