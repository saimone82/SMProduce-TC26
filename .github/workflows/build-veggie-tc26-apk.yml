name: Build Veggie TC26 APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'veggie-tc26-app/**'
      - '.github/workflows/build-veggie-tc26-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Veggie truck launcher icon only
        shell: bash
        run: |
          rm -f veggie-tc26-app/app/src/main/res/drawable/ic_veggie.xml
          printf '%s' '' | base64 --decode > veggie-tc26-app/app/src/main/res/drawable/ic_veggie.webp
          file veggie-tc26-app/app/src/main/res/drawable/ic_veggie.webp

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle -p veggie-tc26-app :app:assembleDebug 2>&1 | tee veggie-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish build result back to repo
        if: always()
        shell: bash
        run: |
          mkdir -p built dist
          echo "build_outcome=${{ steps.build.outcome }}" > built/build-status.txt
          echo "build_exit_code=${{ steps.build.outputs.exit_code }}" >> built/build-status.txt
          cp veggie-build.log built/build.log || true
          if [ -f veggie-tc26-app/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp veggie-tc26-app/app/build/outputs/apk/debug/app-debug.apk dist/SMProduce-Veggie-TC26.apk
            cp dist/SMProduce-Veggie-TC26.apk built/SMProduce-Veggie-TC26.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add built/
          git commit -m "Update Veggie TC26 build result [skip ci]" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: SMProduce-Veggie-TC26-APK
          path: dist/SMProduce-Veggie-TC26.apk
          if-no-files-found: warn
          retention-days: 30
