name: Build TC26 2.0.47

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tc26-modify-from-36
    paths:
      - 'pallets-shipping-android/**'
      - 'tools/patch_tc26_2046_cumulative.py'
      - 'tools/patch_tc26_2046_complete_rules.py'
      - 'tools/patch_tc26_2046_modify_base_api.py'
      - 'tools/patch_tc26_2047_ui_status_popup.py'
      - '.github/workflows/pallets-shipping-build-2047.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply cumulative TC26 patches
        run: |
          python tools/patch_tc26_2046_cumulative.py
          python tools/patch_tc26_2046_complete_rules.py
          python tools/patch_tc26_2046_modify_base_api.py
          python tools/patch_tc26_2047_ui_status_popup.py

      - name: Verify requested TC26 source behaviour
        run: |
          MAIN='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/MainActivity.java'
          TC26='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/Tc26MainActivity.java'
          POP='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/ShippingPalletDialog.java'
          GRADLE='pallets-shipping-android/app/build.gradle'
          grep -F "applicationId 'com.smproduce.palletsshipping.tc26complete247'" "$GRADLE"
          grep -F "versionName '2.0.47-tc26'" "$GRADLE"
          grep -F 'Pallet Shipping' "$TC26"
          grep -F 'showSaveChoice("OPEN")' "$TC26"
          grep -F 'showSaveChoice("PARTIAL")' "$TC26"
          grep -F 'showSaveChoice("COMPLETE")' "$TC26"
          grep -F 'Button closed=button("CLOSED"' "$TC26"
          grep -F 'SAVE ONLY' "$TC26"
          grep -F 'PRINT LABEL' "$TC26"
          grep -F 'ShippingPalletDialog' "$TC26"
          grep -F 'Total cases on pallet' "$POP"
          grep -F 'Variety' "$POP"
          grep -F 'Packaging' "$POP"
          grep -F 'Size' "$POP"
          grep -F 'Cases' "$POP"
          grep -F 'hardware scanner/DataWedge' "$MAIN"
          if grep -Fq 'Camera: REAR' "$MAIN" || grep -Fq 'Camera: FRONT' "$MAIN"; then
            echo 'FRONT/REAR camera controls remain' >&2
            exit 1
          fi
          if grep -Fq 'tablet.tools' "$GRADLE"; then
            echo 'Tablet package regression found' >&2
            exit 1
          fi

      - name: Build Android APK
        run: gradle -p pallets-shipping-android assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK='pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.smproduce.palletsshipping.tc26complete247'"
          echo "$BADGING" | grep "versionName='2.0.47-tc26'"
          echo "$BADGING" | grep "application-label:'Pallet Shipping'"
          echo "$BADGING" | grep "launchable-activity: name='com.smproduce.palletsshipping.Tc26MainActivity'"
          unzip -t "$APK"
          rm -rf /tmp/tc26apk && mkdir -p /tmp/tc26apk
          unzip -q "$APK" 'classes*.dex' -d /tmp/tc26apk
          cat /tmp/tc26apk/classes*.dex | strings > /tmp/tc26-strings.txt
          grep -F 'Pallet Shipping' /tmp/tc26-strings.txt
          grep -F 'SAVE ONLY' /tmp/tc26-strings.txt
          grep -F 'PRINT LABEL' /tmp/tc26-strings.txt
          grep -F 'SELECT ANOTHER PALLET' /tmp/tc26-strings.txt
          grep -F 'Pallet added' /tmp/tc26-strings.txt
          grep -F 'Total cases on pallet' /tmp/tc26-strings.txt
          grep -F 'scanner_pallet_lookup' /tmp/tc26-strings.txt
          if grep -Fq 'Camera: REAR' /tmp/tc26-strings.txt || grep -Fq 'Camera: FRONT' /tmp/tc26-strings.txt; then
            echo 'FRONT/REAR camera controls found in APK' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pallet-Shipping-TC26-2.0.47
          path: pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk
