name: DUMPING APK - SM Produce

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dumpingapp/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-dumping-apk.yml'

jobs:
  build-dumping:
    name: Build DUMPING only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build DUMPING APK
        run: gradle :dumpingapp:assembleDebug
      - name: Rename DUMPING APK clearly
        run: |
          mkdir -p dist
          cp dumpingapp/build/outputs/apk/debug/dumpingapp-debug.apk dist/SMProduce-DUMPING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DUMPING-APK-ONLY
          path: dist/SMProduce-DUMPING.apk
          if-no-files-found: error
