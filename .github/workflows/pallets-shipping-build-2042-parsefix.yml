name: Build TC26 2.0.42 Parsefix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tc26-modify-from-36
    paths:
      - 'tools/patch_tc26_2042.py'
      - 'tools/patch_tc26_server_2042.py'
      - 'tools/patch_tc26_2042_parsefix.py'
      - '.github/workflows/pallets-shipping-build-2042-parsefix.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply 2.0.42 application and server patches
        run: |
          python tools/patch_tc26_2042.py
          python tools/patch_tc26_server_2042.py
          python tools/patch_tc26_2042_parsefix.py
      - name: Build standard Android debug APK
        run: gradle -p pallets-shipping-android assembleDebug
      - name: Verify APK with Android build tools
        run: |
          APK='pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          echo "apksigner=$APKSIGNER"
          echo "aapt=$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -20
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Pallets-Shipping-TC26-2.0.42-PARSEFIX
          path: pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TC26-2.0.42-PARSEFIX-Server-Patch
          path: |
            webapp/api/pallets_shipping_app.php
            webapp/api/tc26_modify_pallet.php
