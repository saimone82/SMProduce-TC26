name: CASE SCANNER APK — SM Produce

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build-case-scanner:
    name: Build CASE SCANNER only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build CASE SCANNER APK
        run: gradle :app:assembleDebug
      - name: Rename CASE SCANNER APK clearly
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SMProduce-CASE-SCANNER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CASE-SCANNER-APK-ONLY
          path: dist/SMProduce-CASE-SCANNER.apk
          if-no-files-found: error
