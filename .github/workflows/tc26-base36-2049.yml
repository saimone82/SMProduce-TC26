name: Build TC26 2.0.49 from ORIGINAL 36
on:
  workflow_dispatch:
  push:
    branches: [rebuild/tc26-base36-2.0.49]
    paths: ['tc26-base36/**', '.github/workflows/tc26-base36-2049.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install 'androguard==4.1.3'
      - name: Decode exact 36 without recompiling its DEX
        run: |
          set -euo pipefail
          curl -fLsS -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  apktool.jar' | sha256sum -c -
          echo 'c37446076d1f7d7cbf6fd8c02583d0e02b942eb5424b383a246e56f7ef74168a  tc26-base36/reference/base36.apk' | sha256sum -c -
          java -jar apktool.jar d -s tc26-base36/reference/base36.apk -o decoded36
          python tc26-base36/prepare_manifest.py decoded36
      - name: Compile additive Java activity (stubs excluded)
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p compile-stubs compile-overlay dex-overlay
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d compile-stubs $(find tc26-base36/stubs -name '*.java')
          jar cf stubs.jar -C compile-stubs .
          javac -source 8 -target 8 -cp "$ANDROID_JAR:stubs.jar" -d compile-overlay $(find tc26-base36/src -name '*.java')
          jar cf overlay.jar -C compile-overlay .
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_JAR" --classpath stubs.jar --output dex-overlay overlay.jar
          cp dex-overlay/classes.dex decoded36/classes7.dex
      - name: Assemble align sign and verify
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p dist
          java -jar apktool.jar b decoded36 -o rebuilt.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 rebuilt.apk aligned.apk
          keytool -genkeypair -keystore signing.jks -storepass android -keypass android -alias tc26build -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SM Produce TC26 Build'
          APK=dist/Pallet-Shipping-TC26-2.0.49-BASE36.apk
          "$BUILD_TOOLS/apksigner" sign --ks signing.jks --ks-pass pass:android --out "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
          unzip -t "$APK"
          python tc26-base36/verify_apk.py tc26-base36/reference/base36.apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: TC26-2.0.49-ORIGINAL-BASE36
          path: dist/*.apk
