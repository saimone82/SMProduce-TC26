name: Export Android APK Tools
on:
  workflow_dispatch: {}
  push:
    branches: [ apk-2-0-59-po-ui ]
    paths:
      - '.github/workflows/export-android-tools.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect tools
        run: |
          set -eux
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using $BT"
          mkdir -p apk-tools/lib apk-tools/runtime
          cp "$BT/apksigner" apk-tools/
          cp "$BT/zipalign" apk-tools/
          cp "$BT/lib/apksigner.jar" apk-tools/lib/
          LIBCPP=$(find "$ANDROID_HOME" /usr/local/lib /opt -type f -name 'libc++.so' 2>/dev/null | head -1)
          echo "libc++=$LIBCPP"
          cp "$LIBCPP" apk-tools/runtime/libc++.so
          chmod +x apk-tools/apksigner apk-tools/zipalign
          LD_LIBRARY_PATH="$PWD/apk-tools/runtime" ldd apk-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-tools
          path: apk-tools
