name: Export TC26 APK Toolchain
on:
  workflow_dispatch:
  push:
    branches: [fix/tc26-2052-exact-shared-tc55]
    paths: ['.github/workflows/export-tools-2052.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Collect Android APK tools
        run: |
          set -euo pipefail
          mkdir -p toolpack
          curl -fLsS -o toolpack/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  toolpack/apktool.jar' | sha256sum -c -
          cp "$ANDROID_HOME/platforms/android-35/android.jar" toolpack/android.jar
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$BUILD_TOOLS/d8" toolpack/
          cp "$BUILD_TOOLS/apksigner" toolpack/
          cp "$BUILD_TOOLS/zipalign" toolpack/
          mkdir -p toolpack/lib
          cp "$BUILD_TOOLS/lib/d8.jar" toolpack/lib/
          cp "$BUILD_TOOLS/lib/apksigner.jar" toolpack/lib/
          chmod +x toolpack/d8 toolpack/apksigner toolpack/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: TC26-2052-Toolchain
          path: toolpack
