name: Build Tablet Scanner APKs
on: { workflow_dispatch: {}, push: { branches: [ main ] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug :scannerapp:assembleDebug
      - run: gradle -p pallets-shipping-android :app:assembleDebug
      - run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Case-Scanner-Tablet.apk
          cp scannerapp/build/outputs/apk/debug/scannerapp-debug.apk dist/Scanner-Tablet.apk
          cp pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk dist/Pallets-Shipping-Tablet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Tab-S10-Lite-Scanner-APKs
          path: dist/*.apk
