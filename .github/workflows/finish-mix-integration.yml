name: Finish MIX integration

on:
  push:
    branches: [ feature/mixed-order-lines ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mixed-order-lines
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply final MIX patches
        shell: python
        run: |
          from pathlib import Path

          changed = False

          # Orders: expose MIX creation directly from orders.php.
          p = Path('webapp/pages/orders.php')
          s = p.read_text(encoding='utf-8')
          old = '<a href="orders_add.php" class="btn btn-dark">+ New Order</a>'
          new = '<a href="orders_mix_add.php" class="btn btn-warning fw-bold">+ New MIX Order</a>\n            <a href="orders_add.php" class="btn btn-dark">+ New Order</a>'
          if old in s and 'orders_mix_add.php' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              changed = True

          # TC26: identify MIX orders in the PO picker.
          p = Path('pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = 'names[i]=o.optString("po")+" · "+o.optString("customer_name");'
          new = 'names[i]=o.optString("po")+" · "+o.optString("customer_name")+(o.optInt("has_mix",0)==1?" · MIX":"");'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              changed = True

          # BOL: group real shipped cases by Variety + physical Packaging and
          # combine all real Size values into one product row.
          p = Path('webapp/pages/api/tc26_shipping_api.php')
          s = p.read_text(encoding='utf-8')
          marker = "    unset($v);\n\n    return $rows;\n}\n\n// ── BOL HTML builder"
          if marker in s and 'BOL MIX SIZE GROUPING' not in s:
              block = r'''    unset($v);

    // BOL MIX SIZE GROUPING
    // One BOL row when Variety + physical Packaging match. Sizes come only
    // from CASES actually shipped, never from the list of theoretically allowed SKUs.
    $exactPalletCounts = [];
    try {
        $pcRows = smp_db_fetch_all($db,
            "SELECT
                COALESCE(NULLIF(TRIM(pc.variety),''),NULLIF(TRIM(cc.variety),''),'Unknown') AS variety,
                COALESCE(NULLIF(TRIM(pc.packaging),''),NULLIF(TRIM(cc.packaging),''),'Unknown') AS packaging,
                COUNT(DISTINCT sp.pallet_id) AS pallets
             FROM shipment_pallets sp
             INNER JOIN pallet_cases pc ON pc.pallet_id=sp.pallet_id
             LEFT JOIN casecodes cc ON cc.serial=pc.case_serial
             WHERE sp.shipment_id=?
             GROUP BY
                COALESCE(NULLIF(TRIM(pc.variety),''),NULLIF(TRIM(cc.variety),''),'Unknown'),
                COALESCE(NULLIF(TRIM(pc.packaging),''),NULLIF(TRIM(cc.packaging),''),'Unknown')",
            [$sid]
        ) ?? [];
        foreach ($pcRows as $pr) {
            $pk = strtolower(trim((string)($pr['variety'] ?? 'Unknown'))) . "\x1f" .
                  strtolower(trim((string)($pr['packaging'] ?? 'Unknown')));
            $exactPalletCounts[$pk] = (int)($pr['pallets'] ?? 0);
        }
    } catch (Throwable $_e) {}

    $grouped = [];
    foreach ($rows as $r) {
        $variety = trim((string)($r['variety'] ?? 'Unknown'));
        $physicalPack = trim((string)($r['pc_packaging'] ?? 'Unknown'));
        $orderPack = trim((string)($r['pack_preset'] ?? ''));
        $key = strtolower($variety) . "\x1f" . strtolower($physicalPack) . "\x1f" . strtolower($orderPack);
        if (!isset($grouped[$key])) {
            $grouped[$key] = $r;
            $grouped[$key]['cases'] = 0;
            $grouped[$key]['row_weight'] = 0.0;
            $grouped[$key]['_sizes'] = [];
            $grouped[$key]['_skus'] = [];
        }
        $grouped[$key]['cases'] += (int)($r['cases'] ?? 0);
        $grouped[$key]['row_weight'] += (float)($r['row_weight'] ?? 0);
        $sz = trim((string)($r['size'] ?? ''));
        if ($sz !== '' && strcasecmp($sz, 'Unknown') !== 0) $grouped[$key]['_sizes'][$sz] = true;
        $sk = trim((string)($r['pc_sku'] ?? ''));
        if ($sk !== '' && strcasecmp($sk, 'Unknown') !== 0) $grouped[$key]['_skus'][$sk] = true;
    }

    $rows = [];
    foreach ($grouped as $g) {
        $sizes = array_keys($g['_sizes']);
        natcasesort($sizes);
        $sizeText = implode(' / ', $sizes);
        $skuList = array_keys($g['_skus']);
        natcasesort($skuList);
        $variety = trim((string)($g['variety'] ?? 'Unknown'));
        $physicalPack = trim((string)($g['pc_packaging'] ?? 'Unknown'));
        $pk = strtolower($variety) . "\x1f" . strtolower($physicalPack);
        if (isset($exactPalletCounts[$pk])) $g['pallets'] = $exactPalletCounts[$pk];
        $g['size'] = $sizeText !== '' ? $sizeText : 'Unknown';
        $g['pc_sku'] = implode(' / ', $skuList);
        $parts = [];
        if ($variety !== '' && strcasecmp($variety, 'Unknown') !== 0) $parts[] = $variety;
        if ($sizeText !== '') $parts[] = $sizeText;
        if ($physicalPack !== '' && strcasecmp($physicalPack, 'Unknown') !== 0) $parts[] = $physicalPack;
        $g['product_description'] = $parts ? implode(' | ', $parts) : 'Unknown product';
        unset($g['_sizes'], $g['_skus']);
        $rows[] = $g;
    }

    usort($rows, static function(array $a, array $b): int {
        return strnatcasecmp(
            (string)($a['variety'] ?? '').'|'.(string)($a['pc_packaging'] ?? '').'|'.(string)($a['size'] ?? ''),
            (string)($b['variety'] ?? '').'|'.(string)($b['pc_packaging'] ?? '').'|'.(string)($b['size'] ?? '')
        );
    });

    return $rows;
}

// ── BOL HTML builder'''
              s = s.replace(marker, block, 1)
              p.write_text(s, encoding='utf-8')
              changed = True

          Path('/tmp/mix_changed').write_text('1' if changed else '0')

      - name: PHP syntax checks
        run: |
          php -l webapp/config/orders_mix_lib.php
          php -l webapp/pages/orders_mix_add.php
          php -l webapp/api/pallets_shipping_mix_app.php
          php -l webapp/pages/api/tc26_shipping_mix_api.php
          php -l webapp/pages/api/tc26_shipping_api.php
          php -l webapp/pages/orders.php

      - name: Build Pallets Shipping APK
        run: gradle -p pallets-shipping-android assembleDebug

      - name: Commit generated integration changes
        if: success()
        run: |
          if [ "$(cat /tmp/mix_changed)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add webapp/pages/orders.php webapp/pages/api/tc26_shipping_api.php pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/MainActivity.java
            git commit -m "Complete MIX Orders TC26 and BOL integration"
            git push origin feature/mixed-order-lines
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pallets-Shipping-2.0.5-MIX
          path: pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk
