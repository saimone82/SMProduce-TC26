name: Build TC26 2.0.45 Header

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tc26-modify-from-36
    paths:
      - 'tools/tc26_header_activity_2045.java.txt'
      - 'tools/patch_tc26_2045_header.py'
      - '.github/workflows/pallets-shipping-build-2045-header.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply cumulative app patches
        run: |
          python tools/patch_tc26_2042.py
          python tools/patch_tc26_server_2042.py
          python tools/patch_tc26_2043_complete.py
          python tools/patch_tc26_2044_final.py
          python tools/patch_tc26_2045_header.py

      - name: Validate required UI and cumulative features
        run: |
          FINAL='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/TC26FinalActivity.java'
          MODIFY='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/Tc26MainActivity.java'
          MAIN='pallets-shipping-android/app/src/main/java/com/smproduce/palletsshipping/MainActivity.java'
          grep -F 'TextView app = tv("Pallet Shipping"' "$FINAL"
          grep -F 'ImageButton scannerTop' "$FINAL"
          grep -F 'ImageButton modifyTop' "$FINAL"
          grep -F 'scannerTop.setOnClickListener' "$FINAL"
          grep -F 'modifyTop.setOnClickListener' "$FINAL"
          grep -F 'LOOKUP MODE' "$MODIFY"
          grep -F 'SAVE ONLY' "$MODIFY"
          grep -F 'PRINT LABEL' "$MODIFY"
          grep -F 'DELETE pallet' "$MODIFY"
          grep -F 'Continue Saved Shipment' "$MAIN"
          grep -F 'Pallet already scanned in this shipment' "$MAIN"
          if grep -Fq 'Button editPallet=choice("Modify Existing Pallet"' "$MAIN"; then
            echo 'Large Modify button still present' >&2
            exit 1
          fi
          php -l webapp/api/pallets_shipping_app.php
          php -l webapp/api/tc26_modify_pallet.php

      - name: Build APK
        run: gradle -p pallets-shipping-android assembleDebug

      - name: Verify APK
        run: |
          APK='pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -30
          echo "$BADGING" | grep "package: name='com.smproduce.palletsshipping.tc26header245'"
          echo "$BADGING" | grep "versionName='2.0.45-tc26'"
          echo "$BADGING" | grep "application-label:'Pallet Shipping'"
          echo "$BADGING" | grep "launchable-activity: name='com.smproduce.palletsshipping.TC26FinalActivity'"
          unzip -t "$APK"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/tc26-dex-strings.txt
          grep -F 'Pallet Shipping' /tmp/tc26-dex-strings.txt
          grep -F 'Scanner password' /tmp/tc26-dex-strings.txt
          grep -F 'LOOKUP MODE' /tmp/tc26-dex-strings.txt
          grep -F 'SAVE ONLY' /tmp/tc26-dex-strings.txt
          grep -F 'DELETE pallet' /tmp/tc26-dex-strings.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pallet-Shipping-TC26-2.0.45-HEADER
          path: pallets-shipping-android/app/build/outputs/apk/debug/app-debug.apk
