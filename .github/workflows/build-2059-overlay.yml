name: Build 2.0.59 PO Overlay
on:
  push:
    branches: [ apk-2-0-59-po-ui ]
    paths:
      - 'overlay-2.0.59/**'
      - '.github/workflows/build-2059-overlay.yml'
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p overlay-2.0.59 :app:assembleDebug
      - name: Extract overlay dex
        run: |
          mkdir -p overlay-output
          unzip -j overlay-2.0.59/app/build/outputs/apk/debug/app-debug.apk classes.dex -d overlay-output
          mv overlay-output/classes.dex overlay-output/classes9.dex
      - uses: actions/upload-artifact@v4
        with:
          name: SMProduce-2.0.59-PO-Overlay
          path: overlay-output/classes9.dex
