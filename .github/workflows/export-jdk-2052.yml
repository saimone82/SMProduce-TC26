name: Export JDK for TC26 overlay
on:
  workflow_dispatch:
  push:
    branches: [feature/tc26-2052-multi-zebra]
    paths: ['.github/workflows/export-jdk-2052.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Package JDK
        run: tar -h -C "$(dirname "$JAVA_HOME")" -czf tc26-jdk17.tar.gz "$(basename "$JAVA_HOME")"
      - uses: actions/upload-artifact@v4
        with:
          name: TC26-JDK17
          path: tc26-jdk17.tar.gz
