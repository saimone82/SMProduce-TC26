name: Build Palletization APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'palletapp/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-palletization-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Palletization APK
        run: gradle :palletapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SMProduce-Palletization-APK
          path: palletapp/build/outputs/apk/debug/palletapp-debug.apk
