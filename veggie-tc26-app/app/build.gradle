plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smproduce.veggie.shipping'
    compileSdk 35

    defaultConfig {
        applicationId "com.smproduce.veggie.shipping"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
