plugins { id 'com.android.application' }

android {
    namespace 'com.smproduce.dumping'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smproduce.dumping'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
        buildConfigField 'String', 'DW_ACTION', '"com.smproduce.dumping.SCAN"'
    }

    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
