plugins { id 'com.android.application' }

android {
    namespace 'com.smproduce.warehouse'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smproduce.warehouse'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        buildConfigField 'String', 'BASE_URL', '"https://smproduceprod.uk"'
        buildConfigField 'String', 'TC26_TOKEN', '"SMTC26_SECURE_2026"'
        buildConfigField 'String', 'DW_ACTION', '"com.smproduce.warehouse.SCAN"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
